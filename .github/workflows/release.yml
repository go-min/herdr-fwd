name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - run: scripts/check-release.sh "$RELEASE_TAG"
      - run: git merge-base --is-ancestor "$(git rev-list -n 1 "$RELEASE_TAG")" origin/main
      - if: matrix.platform == 'linux-x86_64'
        run: shellcheck install.sh uninstall.sh scripts/*.sh
      - if: matrix.platform == 'linux-x86_64'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target "${{ matrix.target }}"
      - run: scripts/package-release.sh "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  homebrew-preflight:
    name: verify Homebrew publication access
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify tap credentials
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not configured" >&2
            exit 1
          fi
          if [[ "$(gh api repos/go-min/homebrew-tap --jq '.permissions.push')" != true ]]; then
            echo "HOMEBREW_TAP_TOKEN cannot write to go-min/homebrew-tap" >&2
            exit 1
          fi

  homebrew-test:
    name: test Homebrew formula (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: herdr-fwd
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Configure Git identity for the temporary tap
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Render, install, and test formula
        run: |
          release_base="$RUNNER_TEMP/releases/download/$RELEASE_TAG"
          mkdir -p "$release_base"
          cp release/*.tar.gz "$release_base/"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd release && sha256sum -- *.tar.gz) > "$RUNNER_TEMP/SHA256SUMS"
          else
            (cd release && shasum -a 256 -- *.tar.gz) > "$RUNNER_TEMP/SHA256SUMS"
          fi

          brew tap-new go-min/herdr-fwd-test
          tap="$(brew --repository go-min/herdr-fwd-test)"
          HERDR_FWD_RELEASE_BASE="file://$release_base" \
            herdr-fwd/scripts/render-homebrew-formula.sh \
              "$RELEASE_TAG" "$RUNNER_TEMP/SHA256SUMS" \
              "$tap/Formula/herdr-fwd.rb"
          ruby -e 'path, version = ARGV; formula = File.read(path); marker = /^  license /; raise "formula license marker not found" unless formula.match?(marker); File.write(path, formula.sub(marker) { |license| "  version #{version.dump}\n#{license}" })' \
            "$tap/Formula/herdr-fwd.rb" "${RELEASE_TAG#v}"
          brew style go-min/herdr-fwd-test/herdr-fwd
          brew install go-min/herdr-fwd-test/herdr-fwd
          brew test go-min/herdr-fwd-test/herdr-fwd
          brew uninstall herdr-fwd

  publish:
    needs: [build, homebrew-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/herdr-fwd.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - working-directory: dist
        run: sha256sum -- *.tar.gz *.spdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/*.tar.gz dist/*.spdx.json dist/SHA256SUMS
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes

  homebrew:
    name: propose Homebrew formula update
    needs: [publish, homebrew-preflight, homebrew-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: herdr-fwd
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: go-min/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Download published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --pattern SHA256SUMS
          --dir release
      - name: Render and propose formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          branch="herdr-fwd-$version"
          herdr-fwd/scripts/render-homebrew-formula.sh \
            "$RELEASE_TAG" release/SHA256SUMS \
            homebrew-tap/Formula/herdr-fwd.rb

          cd homebrew-tap
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            git switch -C "$branch" FETCH_HEAD
            git checkout -- Formula/herdr-fwd.rb
            ../herdr-fwd/scripts/render-homebrew-formula.sh \
              "$RELEASE_TAG" ../release/SHA256SUMS \
              Formula/herdr-fwd.rb
          else
            git switch -c "$branch"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/herdr-fwd.rb
          if ! git diff --cached --quiet; then
            git commit -m "herdr-fwd $version"
            git push --set-upstream origin "$branch"
          fi

          existing_pr="$(gh pr list --repo go-min/homebrew-tap \
            --base main --head "$branch" --state open \
            --json url --jq '.[0].url // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "Homebrew pull request already exists: $existing_pr"
          else
            gh pr create --repo go-min/homebrew-tap \
              --base main --head "$branch" \
              --title "herdr-fwd $version" \
              --body "Update herdr-fwd to [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)."
          fi
